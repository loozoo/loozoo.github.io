name: Update photo gallery data

# Keeps everything derived from the gallery in sync with images/photos/:
# thumbnails, EXIF-filled metadata in _data/photos.yml, and the Chromatic
# Geography map data (assets/data/chromatic-analysis.json), which is computed
# over the whole visible gallery. Pushes made here use GITHUB_TOKEN, so they
# don't re-trigger this workflow.

on:
  push:
    branches: [master]
    paths:
      - 'images/photos/**'
      - '_data/photos.yml'
      - 'scripts/generate_photo_thumbnails.py'
      - 'scripts/chromatic_analysis.py'
      - 'scripts/requirements-chromatic.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: photo-thumbnails-${{ github.ref }}
  cancel-in-progress: true

jobs:
  thumbnails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-chromatic.txt

      - name: Install dependencies
        run: pip install Pillow PyYAML -r scripts/requirements-chromatic.txt

      - name: Generate thumbnails
        run: python scripts/generate_photo_thumbnails.py

      # Runs after the thumbnails (it links to them) and reads captions and
      # visibility from _data/photos.yml. If it fails, the thumbnails are still
      # committed and the run is marked failed at the end.
      - name: Regenerate Chromatic Geography data
        id: chromatic
        continue-on-error: true
        run: python scripts/chromatic_analysis.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/photos-thumb scripts/.thumbnail-manifest.json _data/photos.yml assets/data/chromatic-analysis.json
          git commit -m "Automated: regenerate photo thumbnails and colour map" || { echo "No changes to commit"; exit 0; }
          git pull --rebase
          git push

      - name: Report colour map failure
        if: steps.chromatic.outcome == 'failure'
        run: |
          echo "::error::scripts/chromatic_analysis.py failed; the Chromatic Geography map was not updated."
          exit 1
