{% include base_path %}

<meta charset="utf-8">

<!-- Favicon (files live in /images/, generated via realfavicongenerator.net) -->
<link rel="icon" href="{{ '/images/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="icon" href="{{ '/images/favicon-32x32.png' | relative_url }}" sizes="32x32" type="image/png">
<link rel="icon" href="{{ '/images/favicon-192x192.png' | relative_url }}" sizes="192x192" type="image/png">
<link rel="shortcut icon" href="{{ '/images/favicon.ico' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/images/apple-touch-icon-180x180.png' | relative_url }}">
<link rel="manifest" href="{{ '/images/manifest.json' | relative_url }}">

{% include seo.html %}

<!-- IBM Plex Sans is self-hosted (see _sass/include/_fonts.scss) rather than
     loaded from Google's CDN -- avoids leaking every visitor's IP/user-agent
     to Google on each page load and drops a render-blocking third-party
     request. -->

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
